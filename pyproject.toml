[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ROME"
version = "0.0.1"
description = "RADICAL Optimizer for Model Enhancement"

authors = [
    {name = "Andrew Park", email = "andrew.park2@rutgers.edu"},
    {name = "RADICAL Lab"},
]
maintainers = [
    {name = "Andrew Park", email = "andrew.park2@rutgers.edu"},
]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "pandas",
    "torch",
    "transformers",
    "peft",
    "trl",
    "datasets",
    "radical.asyncflow",
    "rhapsody-py[radical_pilot]",
    'rhapsody-py[dragon]; python_version >= "3.10" and python_version <= "3.12"',
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-mock",
]

# Documentation dependencies are in docs/requirements.txt rather than an extra.
# The docs build reads the source statically (mkdocstrings uses griffe, which
# parses rather than imports), so it needs none of the runtime dependencies --
# no Dragon, no torch, no GPU -- and an extra would drag all of them in.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fast: unit, smoke, and mocked-integration tests (default for any test not marked slow)",
    "slow: end-to-end tests that download a model and run training",
]

[tool.setuptools.packages.find]
include = ["rome*"]